<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kitchen Queue | Mambo ya Tanga</title><link rel="icon" href="img/favicon.svg" type="image/svg+xml"><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css?v=20260920x" rel="stylesheet"><script src="js/i18n.js?v=2"></script><style>@media print{body *{visibility:hidden}.ticket,.ticket *{visibility:visible}.ticket{position:absolute;left:0;top:0;width:100%}}</style></head>
<body class="bg-light"><main class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-primary fw-bold mb-1">MAMBO YA TANGA</p><h1 class="h3 mb-0">Kitchen queue</h1></div><button id="printAll" class="btn btn-outline-primary">Print queue</button></div><div id="loginNotice" class="alert alert-info">Sign in through the staff dashboard first, then open this page.</div><div id="queue" class="row g-3"></div></main><script>
(function(){var queue=document.getElementById("queue");function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});}function money(v){return new Intl.NumberFormat("en-TZ",{style:"currency",currency:"TZS",maximumFractionDigits:0}).format(Number(v)||0);}function load(){fetch("api/index.php?action=dashboard").then(function(r){if(!r.ok)throw Error("Please sign in first.");return r.json();}).then(function(d){document.getElementById("loginNotice").className="alert alert-success";document.getElementById("loginNotice").textContent="Live kitchen queue · refreshes every 15 seconds";var items={};d.order_items.forEach(function(i){(items[i.order_id]||(items[i.order_id]=[])).push(i);});var orders=d.orders.filter(function(o){return ["Pending","Accepted"].indexOf(o.status)>=0;});queue.innerHTML=orders.length?orders.map(function(o){return'<div class="col-md-6 col-xl-4"><article class="card ticket shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><strong>'+esc(o.order_reference||("#"+o.id))+'</strong><span class="badge text-bg-warning">'+esc(o.status)+'</span></div><p class="mb-2">'+esc(o.order_type)+' · '+esc(o.customer_name)+'<br><small>'+esc(o.phone)+'</small></p><ul>'+ (items[o.id]||[]).map(function(i){return'<li>'+esc(i.name)+' × '+i.quantity+'</li>';}).join("")+'</ul><p class="small text-muted mb-2">'+esc(o.notes||"No special notes")+'</p><strong>'+money(o.total)+'</strong><button class="btn btn-primary btn-sm float-end" onclick="window.print()">Print</button></div></article></div>';}).join(""):'<div class="col-12"><div class="alert alert-success">No pending kitchen orders.</div></div>';}).catch(function(e){document.getElementById("loginNotice").className="alert alert-danger";document.getElementById("loginNotice").textContent=e.message;});}document.getElementById("printAll").onclick=function(){window.print();};load();setInterval(load,15000);}());
</script></body></html>
